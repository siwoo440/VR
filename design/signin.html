<!DOCTYPE html> <!-- HTML5 문서 -->
<html lang="ko"> <!-- 한국어 문서 -->
<head> <!-- 문서 정보 시작 -->
    <meta charset="UTF-8"> <!-- 한글 인코딩 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 반응형 화면 -->
    <meta name="robots" content="noindex"> <!-- 검색 제외 -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"> <!-- 파비콘 -->
    <title>시작하기 · Atelier | Verse 시안</title> <!-- 브라우저 제목 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"> <!-- 본문 글꼴 -->
    <link rel="stylesheet" href="assets/tokens.css"> <!-- 테마 토큰 -->
    <link rel="stylesheet" href="assets/base.css"> <!-- 기본 틀 -->
    <link rel="stylesheet" href="assets/components.css"> <!-- 구성요소 -->
    <link rel="stylesheet" href="assets/screens.css"> <!-- 화면별 배치 -->
    <script src="assets/shell.js"></script> <!-- 공통 틀과 화면 모드 -->
    <script src="assets/scene.js" defer></script> <!-- 블록 장면 그림 -->
</head> <!-- 문서 정보 끝 -->
<body data-av-shell="full"> <!-- 전체 화면 시작하기 -->
    <main class="av-signin"> <!-- 시작하기 본문 -->
        <section class="av-signin-art av-grid-paper" aria-label="서비스 소개"> <!-- 소개 그림 쪽 -->
            <a class="av-brand" href="index.html"><span class="av-brand-mark"></span><span translate="no">Atelier | Verse</span></a> <!-- 서비스 이름 -->
            <div class="av-scene" data-av-scene="시작하는 작업실" data-av-size="8" data-av-people="친구,나" data-av-label="블록으로 만든 작은 공간에 두 사람이 서 있는 모습"></div> <!-- 소개 그림 -->
            <p class="av-signin-lead">나만의 공간을 만들고 <mark>함께 머무르다</mark></p> <!-- 소개 문구 -->
            <p class="av-note">링크나 방 코드로 친구를 초대합니다. PC와 VR 기기가 같은 방에서 만납니다.</p> <!-- 소개 설명 -->
        </section> <!-- 소개 그림 쪽 끝 -->

        <section class="av-signin-form"> <!-- 로그인 양식 쪽 -->
            <div class="av-cluster av-signin-top"><span class="av-stage">시안 · 예시 화면</span><button class="av-button av-button-quiet av-button-icon" type="button" data-av-mode></button></div> <!-- 시안 표시와 화면 모드 -->
            <ol class="av-steps" aria-label="시작 단계"> <!-- 시작 단계 -->
                <li aria-current="step">계정</li> <!-- 1단계: 계정 -->
                <li>캐릭터</li> <!-- 2단계: 캐릭터 -->
                <li>내 작업실</li> <!-- 3단계: 내 작업실 -->
            </ol> <!-- 시작 단계 끝 -->
            <h1 class="av-map-title">시작하기</h1> <!-- 화면 제목 -->
            <p class="av-note">홈페이지와 Mate | Verse에서 쓰는 Palettra 계정으로 그대로 들어옵니다.</p> <!-- 통합 계정 안내 -->
            <form class="av-stack" action="studio.html"> <!-- 로그인 양식 -->
                <a class="av-button av-button-primary av-button-wide" href="profile.html"><span class="av-icon" data-i="lock"></span>Palettra 계정으로 계속</a> <!-- 통합 계정 로그인 -->
                <div class="av-field"><label class="av-label" for="email">이메일</label><input class="av-input" id="email" type="email" placeholder="name@example.com" autocomplete="email"></div> <!-- 이메일 입력 -->
                <fieldset class="av-agree"> <!-- 동의 묶음 -->
                    <legend class="av-label">가입 확인</legend> <!-- 묶음 이름 -->
                    <label class="av-check"><input type="checkbox" required><span>만 14세 이상입니다. <strong>(필수)</strong></span></label> <!-- 나이 확인 -->
                    <label class="av-check"><input type="checkbox" required><span>이용약관과 개인정보 처리방침에 동의합니다. <strong>(필수)</strong></span></label> <!-- 약관 동의 -->
                    <label class="av-check"><input type="checkbox"><span>새 소식을 이메일로 받습니다. (선택)</span></label> <!-- 소식 수신 동의 -->
                </fieldset> <!-- 동의 묶음 끝 -->
                <button class="av-button av-button-wide" type="submit">이메일로 계속</button> <!-- 이메일 로그인 -->
            </form> <!-- 로그인 양식 끝 -->
            <p class="av-help">만 14세 미만은 가입할 수 없습니다. 나이 확인 방법과 약관 문구는 법률 검토 전입니다.</p> <!-- 나이 제한 안내 -->
        </section> <!-- 로그인 양식 쪽 끝 -->
    </main> <!-- 시작하기 본문 끝 -->
</body> <!-- 전체 화면 시작하기 끝 -->
</html> <!-- 문서 끝 -->
