<!DOCTYPE html> <!-- HTML5 문서 -->
<html lang="ko"> <!-- 한국어 문서 -->
<head> <!-- 문서 정보 시작 -->
    <meta charset="UTF-8"> <!-- 한글 인코딩 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 반응형 화면 -->
    <meta name="robots" content="noindex"> <!-- 검색 제외 -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"> <!-- 파비콘 -->
    <title>처음 안내 · Atelier | Verse 시안</title> <!-- 브라우저 제목 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"> <!-- 본문 글꼴 -->
    <link rel="stylesheet" href="assets/tokens.css"> <!-- 테마 토큰 -->
    <link rel="stylesheet" href="assets/base.css"> <!-- 기본 틀 -->
    <link rel="stylesheet" href="assets/components.css"> <!-- 구성요소 -->
    <link rel="stylesheet" href="assets/screens.css"> <!-- 화면별 배치 -->
    <script src="assets/shell.js"></script> <!-- 공통 틀과 화면 모드 -->
    <script src="assets/scene.js" defer></script> <!-- 블록 장면 그림 -->
</head> <!-- 문서 정보 끝 -->
<body data-av-shell="full"> <!-- 전체 화면 처음 안내 -->
    <main class="av-signin"> <!-- 처음 안내 본문 -->
        <section class="av-signin-art av-grid-paper" aria-label="시작하는 순서"> <!-- 안내 쪽 -->
            <a class="av-brand" href="index.html"><span class="av-brand-mark"></span><span translate="no">Atelier | Verse</span></a> <!-- 서비스 이름 -->
            <p class="av-signin-lead">세 걸음이면 <mark>첫 방이 생깁니다</mark></p> <!-- 안내 문구 -->
            <ol class="av-welcome-list"> <!-- 시작 순서 -->
                <li class="av-card av-card-flat av-part"><span class="av-part-icon" data-av-avatar="1" data-av-color="gold"></span><span class="av-row-text"><span class="av-row-title">캐릭터를 고릅니다</span><span class="av-row-sub">방에서 다른 사람에게 보이는 모습입니다.</span></span></li> <!-- 첫째 걸음 -->
                <li class="av-card av-card-flat av-part"><span class="av-part-icon" data-av-block="house" data-av-color="clay"></span><span class="av-row-text"><span class="av-row-title">블록을 놓아 방을 만듭니다</span><span class="av-row-sub">빈 모눈 바닥에 부품을 골라 놓으면 됩니다.</span></span></li> <!-- 둘째 걸음 -->
                <li class="av-card av-card-flat av-part"><span class="av-part-icon" data-av-block="lamp" data-av-color="gold"></span><span class="av-row-text"><span class="av-row-title">링크로 친구를 부릅니다</span><span class="av-row-sub">설치 없이 들어오고, 한 방에 8명까지 함께 있습니다.</span></span></li> <!-- 셋째 걸음 -->
            </ol> <!-- 시작 순서 끝 -->
        </section> <!-- 안내 쪽 끝 -->

        <section class="av-signin-form"> <!-- 입력 쪽 -->
            <div class="av-cluster av-signin-top"><span class="av-stage">시안 · 예시 화면</span><button class="av-button av-button-quiet av-button-icon" type="button" data-av-mode></button></div> <!-- 시안 표시와 화면 모드 -->
            <ol class="av-steps" aria-label="시작 단계"> <!-- 시작 단계 -->
                <li>계정</li> <!-- 1단계: 계정 -->
                <li aria-current="step">캐릭터</li> <!-- 2단계: 캐릭터 -->
                <li>내 작업실</li> <!-- 3단계: 내 작업실 -->
            </ol> <!-- 시작 단계 끝 -->
            <h1 class="av-map-title">캐릭터와 이름 정하기</h1> <!-- 화면 제목 -->
            <form class="av-stack" action="studio.html"> <!-- 캐릭터 양식 -->
                <div class="av-field"><label class="av-label" for="welcome-nickname">이 서비스에서 쓸 이름</label><input class="av-input" id="welcome-nickname" maxlength="20" placeholder="1~20자" autocomplete="nickname"><p class="av-help">방과 소식에 표시됩니다. 홈페이지의 닉네임과 다르게 정할 수 있고 나중에 바꿀 수 있습니다.</p></div> <!-- 서비스 안 이름 -->
                <div class="av-field"> <!-- 캐릭터 고르기 묶음 -->
                    <span class="av-label">캐릭터</span> <!-- 묶음 이름 -->
                    <div class="av-character-grid" role="group" aria-label="캐릭터 종류"> <!-- 캐릭터 종류 격자 -->
                        <button class="av-character" type="button" data-av-set="welcome-character" aria-pressed="true"><span class="av-character-art" data-av-avatar="0" data-av-color="gold"></span>기본</button> <!-- 캐릭터 0 -->
                        <button class="av-character" type="button" data-av-set="welcome-character" aria-pressed="false"><span class="av-character-art" data-av-avatar="1" data-av-color="gold"></span>납작 모자</button> <!-- 캐릭터 1 -->
                        <button class="av-character" type="button" data-av-set="welcome-character" aria-pressed="false"><span class="av-character-art" data-av-avatar="2" data-av-color="gold"></span>두 귀</button> <!-- 캐릭터 2 -->
                        <button class="av-character" type="button" data-av-set="welcome-character" aria-pressed="false"><span class="av-character-art" data-av-avatar="3" data-av-color="gold"></span>더듬이</button> <!-- 캐릭터 3 -->
                    </div> <!-- 캐릭터 종류 격자 끝 -->
                </div> <!-- 캐릭터 고르기 묶음 끝 -->
                <div class="av-field"><span class="av-label">몸 색</span><div class="av-swatches"><button class="av-swatch" type="button" data-av-set="welcome-body" aria-pressed="true" aria-label="골드" style="--av-swatch: var(--av-gold)"></button><button class="av-swatch" type="button" data-av-set="welcome-body" aria-pressed="false" aria-label="블루" style="--av-swatch: var(--av-blue)"></button><button class="av-swatch" type="button" data-av-set="welcome-body" aria-pressed="false" aria-label="테라코타" style="--av-swatch: var(--av-clay)"></button><button class="av-swatch" type="button" data-av-set="welcome-body" aria-pressed="false" aria-label="초록" style="--av-swatch: var(--av-leaf)"></button></div></div> <!-- 몸 색 고르기 -->
                <div class="av-cluster"><button class="av-button av-button-primary" type="submit">내 작업실로 가기</button><a class="av-button av-button-quiet" href="studio.html">나중에 정하기</a></div> <!-- 다음 단계와 건너뛰기 -->
            </form> <!-- 캐릭터 양식 끝 -->
        </section> <!-- 입력 쪽 끝 -->
    </main> <!-- 처음 안내 본문 끝 -->
</body> <!-- 전체 화면 처음 안내 끝 -->
</html> <!-- 문서 끝 -->
